# ============================================================
#  站点主配置
#  ⚠️ 换域名只改下面这一行 baseURL，其他都不用动
#  免费阶段：'https://用户名.github.io/'（仓库名必须是 用户名.github.io）
#  绑域名后：'https://你的域名.com/'（结尾斜杠不能少）
# ============================================================
baseURL = 'https://the-second-half.github.io/'
theme = 'PaperMod'

defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false   # 中文在根目录 /，英文在 /en/

enableRobotsTXT = true
hasCJKLanguage = true

[pagination]
  pagerSize = 20

[taxonomies]
  tag = 'tags'
  category = 'categories'

[markup.goldmark.renderer]
  unsafe = true

# ------------------------------------------------------------
# 公共参数：两种语言共享，语言级可覆盖
# ------------------------------------------------------------
[params]
  defaultTheme = 'light'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false
  comments = false
  hideFooter = false
  ShowShareButtons = false
  dateFormat = '2006-01-02'
  # 公众号全名 = 全渠道统一检索词（页脚会显示）。改名只改这一行
  wechatName = '过好一生下半场'
  # 发布前保持 true：搜索引擎不收录。正式对外那天改成 false
  # 2026-11-03：序言正式发布，改为 false，允许收录
  noindex = false

# ============================================================
#  中文站（主站，根路径）
# ============================================================
[languages.zh]
  languageName = '中文'
  languageCode = 'zh-CN'
  weight = 1
  title = '下半场'
  contentDir = 'content/zh'   # 中英各用独立目录，互不串台

  [languages.zh.params]
    author = '老夏'
    description = '一位五十岁管理者的身体、心态与现金流重建记录：95kg 到 75kg，两年，三件事。'

    [languages.zh.params.homeInfoParams]
      Title = '下半场：身体、心态、现金'
      Content = "<img class=\"site-avatar\" src=\"/images/avatar.png\" alt=\"下半场\">\n\n50 岁那年，行业下行，公司出事，体检单上一串箭头。两年时间，我把三件事重新做了一遍：体重从 95kg 到 75kg，睡眠回来了，收支理顺了。这里一篇一篇地记，不鸡血，不完美，只是如实。"

  [[languages.zh.menu.main]]
    identifier = 'posts'
    name = '全部记录'
    url = '/posts/'
    weight = 10

  [[languages.zh.menu.main]]
    identifier = 'body'
    name = '身体'
    url = '/categories/body/'
    weight = 20

  [[languages.zh.menu.main]]
    identifier = 'mind'
    name = '心态'
    url = '/categories/mind/'
    weight = 30

  [[languages.zh.menu.main]]
    identifier = 'cash'
    name = '现金'
    url = '/categories/cash/'
    weight = 40

  [[languages.zh.menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 50

# ============================================================
#  英文站（/en/，同一套数据，面向高 RPM 市场）
#  以后若要给它独立域名，在本节加一行：
#    baseURL = 'https://example.com/'
# ============================================================
[languages.en]
  languageName = 'EN'
  languageCode = 'en-US'
  weight = 2
  title = 'Second Half'
  contentDir = 'content/en'

  [languages.en.params]
    author = 'Lao Xia'
    description = 'A manager in his fifties rebuilding body, mind and money. 95 kg to 75 kg in two years. Honest notes, written as they happen.'

    [languages.en.params.homeInfoParams]
      Title = 'The Second Half'
      Content = "<img class=\"site-avatar\" src=\"/images/avatar.png\" alt=\"Second Half\">\n\nAt fifty my industry went down, the company I worked for collapsed, and my blood test came back full of arrows. Two years later I am 20 kg lighter, sleeping again, and spending on purpose. I write when there is something worth saying. No hype, no before-and-after miracles. Just what actually happened."

  [[languages.en.menu.main]]
    identifier = 'posts'
    name = 'All Notes'
    url = '/posts/'
    weight = 10

  [[languages.en.menu.main]]
    identifier = 'body'
    name = 'Body'
    url = '/categories/body/'
    weight = 20

  [[languages.en.menu.main]]
    identifier = 'mind'
    name = 'Mind'
    url = '/categories/mind/'
    weight = 30

  [[languages.en.menu.main]]
    identifier = 'cash'
    name = 'Money'
    url = '/categories/cash/'
    weight = 40

  [[languages.en.menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 50
