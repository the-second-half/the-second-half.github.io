name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Resolve domain from hugo.toml
        id: domain
        run: |
          # 以 hugo.toml 的 baseURL 为唯一真实来源，避免两边不一致
          BASE=$(hugo config | awk -F"= " '/^baseurl/{print $2; exit}' | tr -d "'\"")
          HOST=$(echo "$BASE" | sed -E 's#^https?://##; s#/.*$##')
          echo "baseURL = $BASE"
          echo "host    = $HOST"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          case "$HOST" in
            "" | *REPLACE_ME* | *.github.io) echo "custom=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "custom=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc --minify --baseURL "${{ steps.domain.outputs.base }}"
      - name: Write CNAME (only for custom domain)
        if: steps.domain.outputs.custom == 'true'
        run: |
          echo "${{ steps.domain.outputs.host }}" > public/CNAME
          echo "CNAME -> ${{ steps.domain.outputs.host }}"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
